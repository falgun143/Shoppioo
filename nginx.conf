# Nginx config for shoppioo.in
# Place at: /etc/nginx/sites-available/shoppioo
# Then: sudo ln -s /etc/nginx/sites-available/shoppioo /etc/nginx/sites-enabled/
# SSL via: sudo certbot --nginx -d shoppioo.in -d www.shoppioo.in

upstream shoppioo_backend {
    least_conn;
    server 127.0.0.1:5000;
    keepalive 64;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name shoppioo.in www.shoppioo.in;
    return 301 https://$host$request_uri;
}

# Redirect www → non-www
server {
    listen 443 ssl http2;
    server_name www.shoppioo.in;
    ssl_certificate /etc/letsencrypt/live/shoppioo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shoppioo.in/privkey.pem;
    return 301 https://shoppioo.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shoppioo.in;

    ssl_certificate /etc/letsencrypt/live/shoppioo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shoppioo.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client body size (for image uploads)
    client_max_body_size 20M;

    # API proxy
    location /api/ {
        proxy_pass http://shoppioo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Razorpay webhook (no rate limit)
    location /api/v1/payment/webhook {
        proxy_pass http://shoppioo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static frontend (React build)
    location / {
        root /var/www/shoppioo/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;  # SPA fallback

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
